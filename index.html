<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Lab Explorer - Menu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            background-color: #f8fafc;
            overflow-x: hidden;
        }

        /* Home Screen Styles */
        #homeScreen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 20px;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .home-title {
            font-size: 3.5rem;
            color: #102a43;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .home-subtitle {
            font-size: 1.25rem;
            color: #627d98;
            margin-bottom: 5rem;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
        }

        .card-container {
            display: flex;
            gap: 2.5rem;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(226, 232, 240, 0.5);
            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0d9488, #06b6d4);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
            border-color: rgba(13, 148, 136, 0.2);
        }

        .card:hover::after {
            opacity: 1;
        }

        .icon-box {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            background: linear-gradient(135deg, #0d9488 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2.5rem;
            color: white;
            box-shadow: 0 10px 20px -5px rgba(13, 148, 136, 0.3);
            transition: transform 0.3s ease;
        }

        .card:hover .icon-box {
            transform: scale(1.1) rotate(5deg);
        }

        .card h3 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #102a43;
            margin-bottom: 2.5rem;
            text-align: center;
            line-height: 1.3;
        }

        .tap-link {
            font-size: 0.95rem;
            font-weight: 600;
            color: #06b6d4;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: auto;
            transition: gap 0.3s ease;
        }

        .card:hover .tap-link {
            gap: 0.8rem;
            color: #0d9488;
        }

        /* Outcome Popup Styles */
        #outcomePopup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            z-index: 2500;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .popup-card {
            background: white;
            border-radius: 32px;
            width: 100%;
            max-width: 650px;
            margin: auto;
            /* Vertically centers when content is small, ensures top is reachable when large */
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            /* Prevents card from collapsing */
        }

        #outcomePopup.active .popup-card {
            transform: scale(1);
        }

        .popup-content-scroll {
            overflow-y: auto;
            padding-right: 8px;
            margin-right: -8px;
        }

        /* Custom Scrollbar for the popup */
        .popup-content-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .popup-content-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .popup-content-scroll::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        @media (max-height: 700px) {
            .popup-card {
                padding: 24px;
                border-radius: 20px;
            }

            .popup-header {
                margin-bottom: 1.5rem;
            }

            .popup-header h2 {
                font-size: 1.6rem;
            }

            .outcome-item {
                padding: 12px 16px;
            }
        }

        .popup-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .check-icon {
            width: 48px;
            height: 48px;
            background: #e0f2fe;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0ea5e9;
        }

        .popup-header h2 {
            font-size: 2.2rem;
            color: #102a43;
            font-weight: 700;
        }

        .outcome-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            margin-bottom: 3rem;
        }

        .outcome-item {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            padding: 20px 24px;
            background: #f8fafc;
            border-radius: 20px;
        }

        .outcome-number {
            width: 32px;
            height: 32px;
            background: #06b6d4;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .outcome-text {
            color: #334e68;
            font-size: 1.15rem;
            line-height: 1.5;
        }

        .continue-btn {
            width: 100%;
            padding: 22px;
            background: linear-gradient(90deg, #0d9488, #06b6d4);
            color: white;
            border: none;
            border-radius: 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .continue-btn:hover {
            transform: translateY(-4px);
            filter: brightness(1.1);
        }
    </style>
</head>

<body>
    <div id="homeScreen">
        <h1 class="home-title">Science Lab Explorer</h1>
        <p class="home-subtitle">Select an experiment to begin your interactive learning journey</p>

        <div class="card-container">
            <div class="card" onclick="showOutcomes('exothermic-reaction')">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3 2.5.5 4.5 2.5 4.5 5.5a2.5 2.5 0 0 1-5 0Z">
                        </path>
                        <path
                            d="M15.833 10.5c0-2-1.041-3.417-2.083-4.583C15.833 6.917 19.5 9.833 19.5 14.5c0 3.866-3.134 7-7 7s-7-3.134-7-7c0-2.5 1.5-4.5 3-5.5-.5 1.5.5 3.5 2 4.5.5-2.5 1.5-4.5 4-6.5-.5 3 .833 5.5 1.333 8Z">
                        </path>
                    </svg>
                </div>
                <h3>Exothermic<br>Reaction</h3>
                <div class="tap-link">Tap to Explore <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg></div>
            </div>

            <div class="card" onclick="showOutcomes('plant-cell')">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 18h8"></path>
                        <path d="M3 22h18"></path>
                        <path d="M14 22a7 7 0 1 0-14 0"></path>
                        <path d="M9 14h2"></path>
                        <path d="M9 12a2 2 0 1 0-2 2h2v4a2 2 0 0 0 2 2h2"></path>
                        <path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"></path>
                    </svg>
                </div>
                <h3>Plant Cell<br>Observation</h3>
                <div class="tap-link">Tap to Explore <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg></div>
            </div>

            <div class="card" onclick="showOutcomes('acid-base')">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 2v17.5A2.5 2.5 0 0 1 6.5 22h0A2.5 2.5 0 0 1 4 19.5V2"></path>
                        <path d="M20 2v17.5a2.5 2.5 0 0 1-2.5 2.5h0a2.5 2.5 0 0 1-2.5-2.5V2"></path>
                        <path d="M3 2h7"></path>
                        <path d="M14 2h7"></path>
                        <path d="M9 16h11"></path>
                    </svg>
                </div>
                <h3>Acid-Base<br>Titration</h3>
                <div class="tap-link">Tap to Explore <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg></div>
            </div>
        </div>
    </div>

    <div id="outcomePopup">
        <div class="popup-card">
            <div class="popup-header">
                <div class="check-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h2>Learning Outcomes</h2>
            </div>
            <div class="popup-content-scroll">
                <div id="outcomeList" class="outcome-list"></div>
            </div>
            <button class="continue-btn" onclick="continueToLab()">Continue to Experiment</button>
        </div>
    </div>

    <script>
        let currentExperiment = '';
        const outcomes = {
            'exothermic-reaction': [
                'Recall and activate prior knowledge of chemical bonds and energy release.',
                'Observe and analyze the dramatic thermal discharge of the Thermite process.',
                'Perform the assembly and ignition of an exothermic apparatus in a virtual lab.',
                'Relate exothermic principles to real-world industrial and safety applications.'
            ],
            'plant-cell': ['Identify key organelles', 'Understand cell wall function', 'Observe structure differences', 'Learn about photosynthesis'],
            'acid-base': ['Understand neutralization', 'Learn titration methods', 'Calculate concentrations', 'Observe color changes']
        };

        function showOutcomes(type) {
            currentExperiment = type;
            const list = document.getElementById('outcomeList');
            list.innerHTML = outcomes[type].map((text, i) => `
                <div class="outcome-item">
                    <div class="outcome-number">${i + 1}</div>
                    <div class="outcome-text">${text}</div>
                </div>
            `).join('');

            const popup = document.getElementById('outcomePopup');
            popup.style.display = 'flex';
            setTimeout(() => popup.classList.add('active'), 10);
        }

        function continueToLab() {
            window.location.href = `lab.html?experiment=${currentExperiment}`;
        }
    </script>
</body>

</html>
