<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Lab Explorer - Laboratory</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js with Marker Tracking Support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Particle System Component -->
    <script
        src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@master/dist/aframe-particle-system-component.min.js"></script>

    <!-- A-Frame Extras for Animation Mixer -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f1f5f9;
            border-top: 4px solid #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loadingScreen h2 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        #loadingScreen p {
            color: #64748b;
        }

        #debugPanel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.9);
            color: #22d3ee;
            padding: 15px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-width: 280px;
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.2);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #1e293b;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Menu
    </a>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <h2>Preparing Laboratory...</h2>
        <p>Calibrating AR sensors</p>
    </div>

    <!-- Debug Panel -->
    <div id="debugPanel" style="display: none;">
        <strong>🔍 Debug Info</strong>
        <div id="debugContent"></div>
    </div>

    <!-- A-Frame AR Scene -->
    <a-scene id="arScene" embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3_PARITY65; sourceWidth:1280; sourceHeight:720; displayWidth: 1280; displayHeight: 720;"
        vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;">

        <!-- Assets -->
        <a-assets>
            <!-- Models and textures can be preloaded here -->
        </a-assets>

        <!-- MAIN MARKER (Hiro Pattern - represents the chemistry apparatus) -->
        <a-marker id="mainMarker" type="barcode" value="5" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="mainContent" position="0 0 0" scale="1 1 1">
                <a-entity id="snappedSandBox" visible="true" scale="0.5  0.5 0.5" position="0 0 0">
                    <a-entity gltf-model="Assets/Exothermic reaction/Sand inside square box.glb"></a-entity>
                </a-entity>

                <a-entity id="snappedStand" visible="false" scale="0.25 0.5 0.25" position="-0.2 0.5 0">
                    <a-entity gltf-model="Assets/Exothermic reaction/Stand.glb"></a-entity>
                </a-entity>

                <a-entity id="snappedPot" visible="false" scale="0.2 0.2 0.2" position="-0.1 0.9 0">
                    <a-entity gltf-model="Assets/Exothermic reaction/Ceramic pot.glb"></a-entity>
                </a-entity>

                <a-entity id="snappedMixture" visible="false" scale="0.1 0.1 0.1" position="-0.1 0.9 0">
                    <a-entity gltf-model="Assets/Exothermic reaction/Iron Oxide and Aluminium powder.glb"></a-entity>
                </a-entity>

                <a-entity id="snappedStick" visible="false" scale="0.2 0.2 0.2" position="-0.1 1.1 0" rotation="0 0 15">
                    <a-entity gltf-model="Assets/Exothermic reaction/Magnesium Stick.glb"></a-entity>
                </a-entity>

                <a-text id="tempText" value="25°C" color="#FF4444" position="0 1.25 0" scale="0.15 0.15 0.15"
                    align="center"></a-text>
                <a-text id="labLabel" value="Chemistry Lab" color="#00FF00" position="0 -0.45 0" scale="0.1 0.1 0.1"
                    align="center"></a-text>

                <!-- Thermite Reaction Effect (Modular) -->
                <a-entity id="thermiteEffect" thermite-reaction="active: false" position="0 0.9 0"></a-entity>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 1: HEAT (Barcode 0) -->
        <a-marker id="heatMarker" type="barcode" value="0" emitevents="true" smooth="true" smoothCount="8">
            <a-entity position="0 0 0" scale="3 3 3">
                <a-entity gltf-model="Assets/Exothermic reaction/Lighter.glb" position="0 0 0"
                    animation-mixer="clip: Flame"></a-entity>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 2: POT (Barcode 1) -->
        <a-marker id="potMarker" type="barcode" value="1" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="potOriginalModel" position="0 0 0" scale="1 1 1">
                <a-entity gltf-model="Assets/Exothermic reaction/Ceramic pot.glb" position="0 0 0"></a-entity>
                <a-text value="POT" color="#FFFFFF" position="0 0.5 0" scale="300 300 300" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 3: REAGENT (Barcode 2) -->
        <a-marker id="sandBoxMarker" type="barcode" value="2" emitevents="true" smooth="true" smoothCount="8">
            <a-entity position="0 0 0" scale="5 5 5">
                <a-entity gltf-model="Assets/Exothermic reaction/Sand inside square box.glb"
                    position="0 0 0"></a-entity>
                <a-text value="🧬 REAGENT" color="#FFFFFF" position="0 0.5 0" scale="0.15 0.15 0.15"
                    align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 4: TRIPOD STAND (Barcode 3) -->
        <a-marker id="tripodStandMarker" type="barcode" value="3" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="standOriginalModel" position="0 0 0" scale="5 5 5">
                <a-entity gltf-model="Assets/Exothermic reaction/Stand.glb" position="0 0 0"></a-entity>
                <a-text value="TRIPOD" color="#FFFFFF" position="0 0.5 0" scale="0.2 0.2 0.2" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 5: MIXTURE (Barcode 4) -->
        <a-marker id="mixtureMarker" type="barcode" value="7" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="mixtureOriginalModel" position="0 0 0" scale="0.2 0.2 0.2">
                <a-entity gltf-model="Assets/Exothermic reaction/Iron Oxide and Aluminium powder.glb"
                    position="0 0 0"></a-entity>
                <a-text value="MIXTURE" color="#FFFFFF" position="0 0.5 0" scale="1 1 1" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 6: MAGNESIUM STICK (Barcode 6) -->
        <a-marker id="magnesiumStickMarker" type="barcode" value="6" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="stickOriginalModel" position="0 0 0" scale="1 1 1">
                <a-entity gltf-model="Assets/Exothermic reaction/Magnesium Stick.glb" position="0 0 0"></a-entity>
                <a-text value="STICK" color="#FFFFFF" position="0 0.5 0" scale="0.4 0.4 0.4" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const experimentState = {
            temperature: 25,
            isHeating: false,
            activeMarkers: new Set(),
            isStandAttached: false,
            isPotAttached: false,
            isMixtureAttached: false,
            isStickAttached: false,
            proximityThreshold: 4.0,
            thermiteStartTime: 0,
            thermiteTriggered: false
        };

        // --- Thermite Particle System Component (Enhanced) ---
        AFRAME.registerComponent('thermite-reaction', {
            schema: { active: { default: false } },
            init: function () {
                this.S = 4000; // Max Sparks
                this.SM = 500; // Max Smoke
                this.reactionTime = 0;
                this.active = false;

                // Texture Generation (Radial Spark & Smoke)
                const createRadialTexture = (inner, mid, outer, sz = 64) => {
                    const c = document.createElement('canvas'); c.width = c.height = sz;
                    const ctx = c.getContext('2d');
                    const g = ctx.createRadialGradient(sz / 2, sz / 2, 0, sz / 2, sz / 2, sz / 2);
                    g.addColorStop(0, inner); g.addColorStop(0.28, mid); g.addColorStop(1, outer);
                    ctx.fillStyle = g; ctx.fillRect(0, 0, sz, sz);
                    const tex = new THREE.CanvasTexture(c);
                    return tex;
                };

                this.texSpark = createRadialTexture('rgba(255,255,255,1)', 'rgba(255,140,20,.5)', 'rgba(0,0,0,0)');
                this.texSmoke = createRadialTexture('rgba(180,160,140,.35)', 'rgba(120,100,85,.12)', 'rgba(0,0,0,0)', 128);

                // 1. SPARK SYSTEM SETUP
                this.sparkGeo = new THREE.BufferGeometry();
                this.aSpPosBuffer = new Float32Array(this.S * 3).fill(-1000); // Initialize far away
                this.aSpLBuffer = new Float32Array(this.S);
                this.aSpPBuffer = new Float32Array(this.S);
                this.aSpSzBuffer = new Float32Array(this.S);
                this.aSpBrBuffer = new Float32Array(this.S);

                this.sparkGeo.setAttribute('position', new THREE.BufferAttribute(this.aSpPosBuffer, 3).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aLife', new THREE.BufferAttribute(this.aSpLBuffer, 1).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aPhase', new THREE.BufferAttribute(this.aSpPBuffer, 1).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aSize', new THREE.BufferAttribute(this.aSpSzBuffer, 1).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aBright', new THREE.BufferAttribute(this.aSpBrBuffer, 1).setUsage(THREE.DynamicDrawUsage));

                const SPARK_VERT = `
                    attribute float aLife; attribute float aSize; attribute float aBright; attribute float aPhase;
                    varying float vLife; varying float vBright; varying float vPhase;
                    void main(){
                      vLife = aLife; vBright = aBright; vPhase = aPhase;
                      vec4 mv = modelViewMatrix * vec4(position, 1.0);
                      gl_PointSize = aSize * (200.0 / -mv.z); 
                      gl_Position = projectionMatrix * mv;
                    }
                `;
                const SPARK_FRAG = `
                    uniform sampler2D uTex;
                    varying float vLife; varying float vBright; varying float vPhase;
                    vec3 sparkColor(float t, float phase){
                      if(phase < 1.5) return mix(vec3(1.,.65,.1), vec3(.9,.25,.0), t);
                      if(phase < 2.5) return mix(vec3(1.,1.,.95), vec3(1.,.9,.05), t);
                      if(phase < 3.5){
                          vec3 w=vec3(1.,1.,.97); vec3 y=vec3(1.,.93,.08); vec3 o=vec3(1.,.38,.02);
                          return t < .4 ? mix(w, y, t/.4) : mix(y, o, (t-.4)/.6);
                      }
                      vec3 o=vec3(1.,.4,.04); vec3 r=vec3(.82,.06,.0); vec3 dr=vec3(.28,.01,.0);
                      return t < .5 ? mix(o, r, t/.5) : mix(r, dr, (t-.5)/.5);
                    }
                    void main(){
                      vec4 tex = texture2D(uTex, gl_PointCoord);
                      if(tex.a < .01) discard;
                      float fade = vLife > .75 ? 1.-(vLife-.75)/.25 : 1.;
                      vec3 col = sparkColor(vLife, vPhase) * (.72 + .28*vBright);
                      if(vLife < .2) col += vec3(.8,.6,.3)*(1.-vLife/.2);
                      gl_FragColor = vec4(col * tex.rgb, tex.a * fade);
                    }
                `;

                this.sparkMat = new THREE.ShaderMaterial({
                    uniforms: { uTex: { value: this.texSpark } },
                    vertexShader: SPARK_VERT, fragmentShader: SPARK_FRAG,
                    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
                });
                this.sparkPoints = new THREE.Points(this.sparkGeo, this.sparkMat);
                this.el.setObject3D('sparks', this.sparkPoints);

                // CPU DATA
                this.spPool = Array.from({ length: this.S }, (_, i) => ({
                    id: i, alive: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(),
                    life: 0, maxL: 1, phase: 1, size: 5, bright: 1
                }));

                // 2. SMOKE SYSTEM SETUP
                this.smGeo = new THREE.BufferGeometry();
                this.smPosArr = new Float32Array(this.SM * 3).fill(-1000);
                this.smLArr = new Float32Array(this.SM);
                this.smOpArr = new Float32Array(this.SM);
                this.smSzArr = new Float32Array(this.SM);

                this.smGeo.setAttribute('position', new THREE.BufferAttribute(this.smPosArr, 3).setUsage(THREE.DynamicDrawUsage));
                this.smGeo.setAttribute('aLife', new THREE.BufferAttribute(this.smLArr, 1).setUsage(THREE.DynamicDrawUsage));
                this.smGeo.setAttribute('aOpacity', new THREE.BufferAttribute(this.smOpArr, 1).setUsage(THREE.DynamicDrawUsage));
                this.smGeo.setAttribute('aSize', new THREE.BufferAttribute(this.smSzArr, 1).setUsage(THREE.DynamicDrawUsage));

                const SMOKE_VERT = `
                    attribute float aLife; attribute float aSize; attribute float aOpacity;
                    varying float vLife; varying float vOp;
                    void main(){
                        vLife=aLife; vOp=aOpacity;
                        vec4 mv=modelViewMatrix*vec4(position,1.);
                        gl_PointSize=aSize*(250.0/-mv.z);
                        gl_Position=projectionMatrix*mv;
                    }
                `;
                const SMOKE_FRAG = `
                    uniform sampler2D uTex; varying float vLife; varying float vOp;
                    void main(){
                        vec4 t=texture2D(uTex,gl_PointCoord);
                        if(t.a<.001) discard;
                        float fade=(vLife<.1)?(vLife/.1):(vLife>.7?(1.-(vLife-.7)/.3):1.);
                        float grey=mix(.55,.18,vLife);
                        gl_FragColor=vec4(vec3(grey)*t.rgb, t.a*fade*vOp);
                    }
                `;
                this.smMat = new THREE.ShaderMaterial({
                    uniforms: { uTex: { value: this.texSmoke } },
                    vertexShader: SMOKE_VERT, fragmentShader: SMOKE_FRAG,
                    transparent: true, blending: THREE.NormalBlending, depthWrite: false
                });
                this.smPoints = new THREE.Points(this.smGeo, this.smMat);
                this.el.setObject3D('smoke', this.smPoints);

                this.smPool = Array.from({ length: this.SM }, (_, i) => ({
                    id: i, alive: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(),
                    life: 0, maxL: 3, opacity: 0.5, size: 2
                }));

                this.el.setAttribute('visible', false);
            },

            tick: function (t, dt) {
                if (!this.data.active) return;
                if (!this.el.getAttribute('visible')) this.el.setAttribute('visible', true);

                const delta = dt / 1000;
                this.reactionTime += delta;

                // Spawn Logic
                let spawnRate = 0; let phase = 1;
                if (this.reactionTime < 2) { spawnRate = 20; phase = 1; }
                else if (this.reactionTime < 2.5) { spawnRate = 600; phase = 2; }
                else if (this.reactionTime < 6) { spawnRate = 180; phase = 3; }
                else if (this.reactionTime < 10) { spawnRate = 40; phase = 4; }

                for (let i = 0; i < Math.floor(spawnRate * delta); i++) this.spawnSpark(phase);
                if (Math.random() < delta * 15) this.spawnSmoke();

                // Update Sparks
                const spPosArr = this.sparkGeo.getAttribute('position');
                const spLArr = this.sparkGeo.getAttribute('aLife');
                const spSArr = this.sparkGeo.getAttribute('aSize');
                const spPArr = this.sparkGeo.getAttribute('aPhase');
                const spBArr = this.sparkGeo.getAttribute('aBright');

                this.spPool.forEach(s => {
                    if (!s.alive) return;
                    s.life += delta;
                    const age = s.life / s.maxL;
                    if (age >= 1) {
                        s.alive = false;
                        spPosArr.setXYZ(s.id, -1000, -1000, -1000);
                        return;
                    }
                    s.vel.y -= 9.81 * delta;
                    s.pos.addScaledVector(s.vel, delta);
                    if (s.pos.y < -0.9) { s.pos.y = -0.9; s.vel.y = Math.abs(s.vel.y) * 0.2; }

                    spPosArr.setXYZ(s.id, s.pos.x, s.pos.y, s.pos.z);
                    spLArr.setX(s.id, age);
                    spSArr.setX(s.id, s.size * (1 - age * 0.7));
                    spPArr.setX(s.id, s.phase);
                    spBArr.setX(s.id, s.bright);
                });

                // Update Smoke
                const smPosArr = this.smGeo.getAttribute('position');
                const smLArr = this.smGeo.getAttribute('aLife');
                const smOArr = this.smGeo.getAttribute('aOpacity');
                const smSArr = this.smGeo.getAttribute('aSize');

                this.smPool.forEach(s => {
                    if (!s.alive) return;
                    s.life += delta;
                    const age = s.life / s.maxL;
                    if (age >= 1) {
                        s.alive = false;
                        smPosArr.setXYZ(s.id, -1000, -1000, -1000);
                        return;
                    }
                    s.pos.addScaledVector(s.vel, delta);
                    smPosArr.setXYZ(s.id, s.pos.x, s.pos.y, s.pos.z);
                    smLArr.setX(s.id, age);
                    smOArr.setX(s.id, s.opacity * (1 - age));
                    smSArr.setX(s.id, s.size * (1 + age * 2));
                });

                spPosArr.needsUpdate = true; spLArr.needsUpdate = true;
                spSArr.needsUpdate = true; spPArr.needsUpdate = true; spBArr.needsUpdate = true;
                smPosArr.needsUpdate = true; smLArr.needsUpdate = true;
                smOArr.needsUpdate = true; smSArr.needsUpdate = true;
            },

            spawnSpark: function (phase) {
                const s = this.spPool.find(p => !p.alive);
                if (!s) return;
                s.alive = true; s.life = 0; s.phase = phase; s.pos.set(0, 0, 0);
                s.bright = 0.6 + 0.4 * Math.random();
                const angle = Math.random() * Math.PI * 2;
                if (phase === 2) {
                    const spd = Math.random() * 6 + 4;
                    s.vel.set(Math.cos(angle) * spd, Math.random() * 8 + 2, Math.sin(angle) * spd);
                    s.size = Math.random() * 8 + 4; s.maxL = Math.random() * 1.5 + 0.5;
                } else {
                    s.vel.set((Math.random() - 0.5) * 2, Math.random() * 4 + 2, (Math.random() - 0.5) * 2);
                    s.size = Math.random() * 4 + 2; s.maxL = Math.random() * 2 + 1;
                }
            },

            spawnSmoke: function () {
                const s = this.smPool.find(p => !p.alive);
                if (!s) return;
                s.alive = true; s.life = 0; s.pos.set(0, 0, 0);
                s.vel.set((Math.random() - 0.5) * 0.2, Math.random() * 0.5 + 0.1, (Math.random() - 0.5) * 0.2);
                s.size = Math.random() * 2 + 1; s.maxL = Math.random() * 3 + 2; s.opacity = 0.4;
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const experimentType = params.get('experiment') || 'molar-mass';
            console.log('🧪 Laboratory initialized for:', experimentType);

            if (experimentType === 'plant-cell') {
                document.getElementById('labLabel').setAttribute('value', 'Biology Lab');
            } else if (experimentType === 'acid-base') {
                document.getElementById('labLabel').setAttribute('value', 'Titration Lab');
            }

            const scene = document.getElementById('arScene');
            scene.addEventListener('loaded', () => {
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loadingScreen').style.display = 'none';
                    }, 500);
                }, 2000);
            });

            setupMarkerEventListeners();
            animationLoop();
        });

        function setupMarkerEventListeners() {
            const mainMarker = document.getElementById('mainMarker');
            mainMarker.addEventListener('markerFound', () => experimentState.activeMarkers.add('main'));
            mainMarker.addEventListener('markerLost', () => experimentState.activeMarkers.delete('main'));

            const heatMarker = document.getElementById('heatMarker');
            heatMarker.addEventListener('markerFound', () => experimentState.isHeating = true);
            heatMarker.addEventListener('markerLost', () => experimentState.isHeating = false);

            document.getElementById('potMarker').addEventListener('markerFound', () => experimentState.activeMarkers.add('pot'));
            document.getElementById('tripodStandMarker').addEventListener('markerFound', () => experimentState.activeMarkers.add('stand'));
            document.getElementById('mixtureMarker').addEventListener('markerFound', () => experimentState.activeMarkers.add('mixture'));
            document.getElementById('magnesiumStickMarker').addEventListener('markerFound', () => experimentState.activeMarkers.add('stick'));
        }

        function animationLoop() {
            const mainMarker = document.getElementById('mainMarker');

            if (experimentState.activeMarkers.has('main')) {
                const mainPos = new THREE.Vector3();
                mainMarker.object3D.getWorldPosition(mainPos);

                // Stand
                if (experimentState.activeMarkers.has('stand') && !experimentState.isStandAttached) {
                    const pos = new THREE.Vector3();
                    document.getElementById('tripodStandMarker').object3D.getWorldPosition(pos);
                    if (mainPos.distanceTo(pos) < experimentState.proximityThreshold) {
                        experimentState.isStandAttached = true;
                        document.getElementById('snappedStand').setAttribute('visible', 'true');
                        document.getElementById('standOriginalModel').setAttribute('visible', 'false');
                    }
                }

                // Pot
                if (experimentState.activeMarkers.has('pot') && experimentState.isStandAttached && !experimentState.isPotAttached) {
                    const pos = new THREE.Vector3();
                    document.getElementById('potMarker').object3D.getWorldPosition(pos);
                    if (mainPos.distanceTo(pos) < experimentState.proximityThreshold) {
                        experimentState.isPotAttached = true;
                        document.getElementById('snappedPot').setAttribute('visible', 'true');
                        document.getElementById('potOriginalModel').setAttribute('visible', 'false');
                    }
                }

                // Mixture
                if (experimentState.activeMarkers.has('mixture') && experimentState.isPotAttached && !experimentState.isMixtureAttached) {
                    const pos = new THREE.Vector3();
                    document.getElementById('mixtureMarker').object3D.getWorldPosition(pos);
                    if (mainPos.distanceTo(pos) < experimentState.proximityThreshold) {
                        experimentState.isMixtureAttached = true;
                        document.getElementById('snappedMixture').setAttribute('visible', 'true');
                        document.getElementById('mixtureOriginalModel').setAttribute('visible', 'false');
                    }
                }

                // Stick
                if (experimentState.activeMarkers.has('stick') && experimentState.isMixtureAttached && !experimentState.isStickAttached) {
                    const pos = new THREE.Vector3();
                    document.getElementById('magnesiumStickMarker').object3D.getWorldPosition(pos);
                    if (mainPos.distanceTo(pos) < experimentState.proximityThreshold) {
                        experimentState.isStickAttached = true;
                        document.getElementById('snappedStick').setAttribute('visible', 'true');
                        document.getElementById('stickOriginalModel').setAttribute('visible', 'false');

                        // Start Thermite ignition countdown
                        experimentState.thermiteStartTime = Date.now();
                        console.log('⏳ Thermite countdown started... 5s to ignition');
                    }
                }

                // Handle Thermite Trigger (5s Delay)
                if (experimentState.isStickAttached && !experimentState.thermiteTriggered) {
                    const elapsed = (Date.now() - experimentState.thermiteStartTime) / 1000;
                    if (elapsed >= 5.0) {
                        console.log('💥 THERMITE IGNITION!');
                        experimentState.thermiteTriggered = true;
                        document.getElementById('thermiteEffect').setAttribute('thermite-reaction', 'active: true');
                    }
                }
            }

            if (experimentState.isHeating) {
                experimentState.temperature = Math.min(experimentState.temperature + 2, 100);
            } else if (experimentState.temperature > 25) {
                experimentState.temperature = Math.max(experimentState.temperature - 1, 25);
            }

            document.getElementById('tempText').setAttribute('value', Math.round(experimentState.temperature) + '°C');
            requestAnimationFrame(animationLoop);
        }
    </script>
</body>

</html>
