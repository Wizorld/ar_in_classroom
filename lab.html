<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Lab Explorer - Laboratory</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js with Marker Tracking Support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Particle System Component -->
    <script
        src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@master/dist/aframe-particle-system-component.min.js"></script>

    <!-- A-Frame Extras for Animation Mixer -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <!-- A-Frame Environment Component for Reflections -->
    <script
        src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f1f5f9;
            border-top: 4px solid #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loadingScreen h2 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        #loadingScreen p {
            color: #64748b;
        }

        #debugPanel {
            position: absolute;
            top: 70px;
            left: 10px;
            background: rgba(15, 23, 42, 0.85);
            color: #22d3ee;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            width: 220px;
            z-index: 1000;
            border-left: 4px solid #06b6d4;
            pointer-events: none;
        }

        .debug-item {
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
        }

        .status-ok {
            color: #10b981;
            font-weight: bold;
        }

        .status-wait {
            color: #94a3b8;
        }

        .status-active {
            color: #f59e0b;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #1e293b;
        }

        #quizOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.1);
            backdrop-filter: blur(2px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: flex-end;
            padding: 24px;
            /* Added margin from screen edges */
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 28px;
            /* Fully rounded corners for a floating look */
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            height: auto;
            /* Allow content to define height */
            max-height: calc(100vh - 48px);
            /* Ensure it stays within margins */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            transform: translateX(120%);
            /* Move further off-screen */
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #quizOverlay.active .quiz-card {
            transform: translateX(0);
        }

        .quiz-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            color: #0d9488;
        }

        .quiz-question {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 16px 20px;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            color: #475569;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            background: #e2e8f0;
            border-color: #cbd5e1;
            transform: translateX(4px);
        }

        .option-btn.correct {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .option-btn.incorrect {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .feedback-text {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            display: none;
        }

        .feedback-text.show {
            display: block;
        }

        .feedback-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .feedback-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .quiz-footer {
            margin-top: auto;
            /* Pushes content to bottom of panel */
            padding-top: 32px;
        }

        .quiz-continue-btn {
            padding: 16px 32px;
            background: linear-gradient(90deg, #0d9488, #06b6d4);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            visibility: hidden;
            transition: all 0.3s ease;
            width: 100%;
            /* Full width in side panel */
            box-shadow: 0 10px 15px -3px rgba(6, 182, 212, 0.3);
        }

        .quiz-continue-btn.show {
            visibility: visible;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Menu
    </a>

    <!-- Lab Title -->
    <div
        style="position: absolute; top: 20px; left: 20px; z-index: 100; color: white; background: rgba(15, 23, 42, 0.7); padding: 12px 24px; border-radius: 12px; backdrop-filter: blur(8px);">
        <h1 id="labLabel" style="margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em;">Laboratory
        </h1>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <h2>Preparing Laboratory...</h2>
        <p>Calibrating AR sensors</p>
    </div>

    <!-- Debug Panel -->
    <div id="debugPanel">
        <div
            style="font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid rgba(34, 211, 238, 0.3); padding-bottom: 4px;">
            STATION STATUS
        </div>
        <div id="debugContent"></div>
    </div>

    <!-- Quiz Overlay -->
    <div id="quizOverlay">
        <div class="quiz-card">
            <div class="quiz-header">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                <span
                    style="font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.8rem;">Concept
                    Check</span>
            </div>
            <div id="quizQuestion" class="quiz-question">Loading question...</div>
            <div id="quizOptions" class="options-grid">
                <!-- Options will be injected here -->
            </div>
            <div id="quizFeedback" class="feedback-text"></div>
            <div class="quiz-footer">
                <button id="quizContinueBtn" class="quiz-continue-btn" onclick="closeQuiz()">Continue
                    Experiment</button>
            </div>
        </div>
    </div>

    <!-- A-Frame AR Scene -->
    <a-scene id="arScene" embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3_PARITY65; sourceWidth:1280; sourceHeight:720; displayWidth: 1280; displayHeight: 720;"
        vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; 
        antialias: true; 
        alpha: true;
        powerPreference: high-performance;
        physicallyCorrectLights: true;
        ">

        <!-- Assets -->
        <a-assets>
            <!-- Models and textures can be preloaded here -->
        </a-assets>

        <!-- MAIN MARKER (Hiro Pattern - represents the chemistry apparatus) -->
        <a-marker id="mainMarker" type="barcode" value="5" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="mainContent" position="0 0 0" scale="1 1 1">
                <a-entity id="snappedSandBox" visible="true" scale="0.5  0.5 0.5" position="0 0.5 0">
                    <a-entity id="sandBoxModel" gltf-model="Assets/Exothermic reaction/Sand inside square box.glb"
                        animation-mixer="clip: Animation_1"></a-entity>
                </a-entity>

                <a-entity id="snappedPot" visible="false" scale="0.7 0.7 0.7" position="0.1 0.8 0">
                    <a-entity id="snappedPotModel" gltf-model="Assets/Exothermic reaction/Ceramic pot.glb"
                        animation-mixer="clip: Ceramicpot; loop: once; clampWhenFinished: true"></a-entity>
                </a-entity>

                <a-entity id="snappedMixture" visible="false" scale="0.1 0.1 0.1" position="0.1 0.8 0">
                    <!-- Removed mixture GLB as it is now an animation in snappedPot -->
                </a-entity>

                <a-entity id="snappedStick" visible="false" scale="0.2 0.2 0.2" position="0.1 1.0 0" rotation="0 0 15">
                    <a-entity gltf-model="Assets/Exothermic reaction/Magnesium Stick.glb"></a-entity>
                </a-entity>


                <!-- Thermite Reaction Effect (Modular) -->
                <a-entity id="thermiteEffect" thermite-reaction="active: false" position="0.1 0.82 0"
                    scale="0.06 0.06 0.06"></a-entity>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 1: HEAT (Barcode 0) -->
        <a-marker id="heatMarker" type="barcode" value="0" emitevents="true" smooth="true" smoothCount="8">
            <a-entity position="0 0 0" scale="1 1 1">
                <a-entity gltf-model="Assets/Exothermic reaction/Lighter.glb" position="0 0 0"
                    animation-mixer="clip: Flame"></a-entity>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 2: POT (Barcode 1) -->
        <a-marker id="potMarker" type="barcode" value="1" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="potOriginalModel" position="0 0 0" scale="2 2 2">
                <a-entity gltf-model="Assets/Exothermic reaction/Ceramic pot.glb" position="0 0 0"
                    animation-mixer="clip: Ceramicpot; loop: once; clampWhenFinished: true"></a-entity>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 3: REAGENT (Barcode 2) -->
        <a-marker id="sandBoxMarker" type="barcode" value="2" emitevents="true" smooth="true" smoothCount="8">
            <a-entity position="0 0 0" scale="5 5 5">
                <a-entity gltf-model="Assets/Exothermic reaction/Sand inside square box.glb"
                    position="0 0 0"></a-entity>
            </a-entity>
        </a-marker>


        <!-- EVENT MARKER 5: MIXTURE (Barcode 4) -->
        <a-marker id="mixtureMarker" type="barcode" value="7" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="mixtureOriginalModel" position="0 0 0" scale="0.2 0.2 0.2">
                <a-entity gltf-model="Assets/Exothermic reaction/Iron Oxide and Aluminium powder.glb"
                    position="0 0 0"></a-entity>
                <a-text value="MIXTURE" color="#FFFFFF" position="0 0.5 0" scale="1 1 1" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 6: MAGNESIUM STICK (Barcode 6) -->
        <a-marker id="magnesiumStickMarker" type="barcode" value="6" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="stickOriginalModel" position="0 0 0" scale="1 1 1">
                <a-entity gltf-model="Assets/Exothermic reaction/Magnesium Stick.glb" position="0 0 0"></a-entity>
                <a-text value="STICK" color="#FFFFFF" position="0 0.5 0" scale="0.4 0.4 0.4" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- Lighting -->
        <a-entity light="type: ambient; color: #BBB; intensity: 1.5"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="-1 1 1"></a-entity>

        <!-- Environment Reflection (Hidden but providing envMap for models) -->
        <!-- <a-entity
            environment="preset: contact; lighting: none; skyType: none; ground: none; shadow: false; fog: 0"></a-entity> -->

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const experimentState = {
            temperature: 25,
            isHeating: false,
            activeMarkers: new Set(),
            isPotAttached: false,
            isMixtureAttached: false,
            isStickAttached: false,
            proximityThreshold: 8.0,
            currentDistance: 999,
            proximityTarget: 'none',
            thermiteStartTime: 0, // Used for completion tracking
            thermiteIgnitionTimer: 0, // Added for heatmap application timer
            thermiteTriggered: false,
            thermiteCompleted: false,
            quizActive: false,
            currentQuizLevel: 0
        };

        // --- Thermite Particle System Component (1:1 Port from thermite-staged.html) ---
        AFRAME.registerComponent('thermite-reaction', {
            schema: { active: { default: false } },
            init: function () {
                const P = {
                    maxSparks: 2000,
                    maxSmoke: 200,
                    gravity: -9.81,
                    groundY: 0.1, // Set slightly above base to avoid clipping
                    totalTime: 10.0,
                    phases: [
                        { id: 1, start: 0.0, end: 0.5 },   // Flash (Full size instantly)
                        { id: 2, start: 0.5, end: 5.0 },   // Peak reaction
                        { id: 3, start: 5.0, end: 10.0 }   // Cooldown (Shrink to pea)
                    ]
                };
                this.P = P;
                this.reactionTime = 0;
                this.flashFired = false;

                const radialTex = (inner, mid, outer, sz = 64) => {
                    const c = document.createElement('canvas'); c.width = c.height = sz;
                    const ctx = c.getContext('2d');
                    const g = ctx.createRadialGradient(sz / 2, sz / 2, 0, sz / 2, sz / 2, sz / 2);
                    g.addColorStop(0, inner); g.addColorStop(0.28, mid); g.addColorStop(1, outer);
                    ctx.fillStyle = g; ctx.fillRect(0, 0, sz, sz);
                    return new THREE.CanvasTexture(c);
                };

                const texSpark = radialTex('rgba(255,255,255,1)', 'rgba(255,140,20,.5)', 'rgba(0,0,0,0)');
                const texSmoke = radialTex('rgba(180,160,140,.35)', 'rgba(120,100,85,.12)', 'rgba(0,0,0,0)', 128);
                const texGlow = radialTex('rgba(255,220,120,.9)', 'rgba(255,100,10,.35)', 'rgba(0,0,0,0)', 128);

                this.coreMat = new THREE.MeshBasicMaterial({ map: texGlow, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, side: THREE.DoubleSide });
                this.coreMesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), this.coreMat);
                this.coreMesh.position.y = 0.05;
                this.el.setObject3D('core', this.coreMesh);

                this.haloMat = new THREE.MeshBasicMaterial({ map: texGlow, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, side: THREE.DoubleSide });
                this.haloMesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), this.haloMat);
                this.haloMesh.position.y = 0.04;
                this.el.setObject3D('halo', this.haloMesh);

                const S = P.maxSparks;
                this.S = S;
                this.spx = new Float32Array(S); this.spy = new Float32Array(S); this.spz = new Float32Array(S);
                this.svx = new Float32Array(S); this.svy = new Float32Array(S); this.svz = new Float32Array(S);
                this.sLife = new Float32Array(S); this.sMaxL = new Float32Array(S);
                this.sAlive = new Uint8Array(S); this.sSec = new Uint8Array(S);
                this.sBnc = new Uint8Array(S); this.sPhase = new Uint8Array(S);

                this.sparkGeo = new THREE.BufferGeometry();
                this.aSpPos = new Float32Array(S * 3).fill(-200);
                this.aSpL = new Float32Array(S);
                this.aSpSz = new Float32Array(S);
                this.aSpBr = new Float32Array(S);
                this.aSpP = new Float32Array(S);

                this.sparkGeo.setAttribute('position', new THREE.BufferAttribute(this.aSpPos, 3).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aLife', new THREE.BufferAttribute(this.aSpL, 1).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aSize', new THREE.BufferAttribute(this.aSpSz, 1).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aBright', new THREE.BufferAttribute(this.aSpBr, 1).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aPhase', new THREE.BufferAttribute(this.aSpP, 1).setUsage(THREE.DynamicDrawUsage));

                const SPARK_VERT = `
                    attribute float aLife; attribute float aSize; attribute float aBright; attribute float aPhase;
                    varying float vLife; varying float vBright; varying float vPhase;
                    void main(){
                        vLife = aLife; vBright = aBright; vPhase = aPhase;
                        vec4 mv = modelViewMatrix * vec4(position,1.);
                        gl_PointSize = aSize * (310. / -mv.z);
                        gl_Position = projectionMatrix * mv;
                    }
                `;
                const SPARK_FRAG = `
                    uniform sampler2D uTex; varying float vLife; varying float vBright; varying float vPhase;
                    vec3 sparkColor(float t, float phase){
                        if(phase < 1.5) return mix(vec3(1.,.65,.1), vec3(.9,.25,.0), t);
                        if(phase < 2.5) return mix(vec3(1.,1.,.95), vec3(1.,.9,.05), t);
                        if(phase < 3.5){
                            vec3 w=vec3(1.,1.,.97); vec3 y=vec3(1.,.93,.08); vec3 o=vec3(1.,.38,.02);
                            return t < .4 ? mix(w, y, t/.4) : mix(y, o, (t-.4)/.6);
                        }
                        vec3 o=vec3(1.,.4,.04); vec3 r=vec3(.82,.06,.0); vec3 dr=vec3(.28,.01,.0);
                        return t < .5 ? mix(o, r, t/.5) : mix(r, dr, (t-.5)/.5);
                    }
                    void main(){
                        vec4 tex = texture2D(uTex, gl_PointCoord);
                        if(tex.a < .012) discard;
                        float fade = vLife > .75 ? 1.-(vLife-.75)/.25 : 1.;
                        vec3 col = sparkColor(vLife, vPhase) * (.72 + .28*vBright);
                        if(vLife < .2) col += vec3(.8,.6,.3)*(1.-vLife/.2);
                        gl_FragColor = vec4(col*tex.rgb, tex.a*fade);
                    }
                `;

                this.sparkMat = new THREE.ShaderMaterial({
                    uniforms: { uTex: { value: texSpark } },
                    vertexShader: SPARK_VERT, fragmentShader: SPARK_FRAG,
                    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false
                });
                this.sparkPoints = new THREE.Points(this.sparkGeo, this.sparkMat);
                this.el.setObject3D('sparks', this.sparkPoints);

                this.sFree = new Int32Array(S); this.sFreeH = S;
                for (let i = 0; i < S; i++) this.sFree[i] = S - 1 - i;

                const SM = P.maxSmoke;
                this.SM = SM;
                this.smPx = new Float32Array(SM); this.smPy = new Float32Array(SM); this.smPz = new Float32Array(SM);
                this.smVx = new Float32Array(SM); this.smVy = new Float32Array(SM); this.smVz = new Float32Array(SM);
                this.smL = new Float32Array(SM); this.smML = new Float32Array(SM);
                this.smAlive = new Uint8Array(SM);

                this.smGeo = new THREE.BufferGeometry();
                this.aSmPos = new Float32Array(SM * 3).fill(-200);
                this.aSmL = new Float32Array(SM);
                this.aSmSz = new Float32Array(SM);
                this.aSmOp = new Float32Array(SM);

                this.smGeo.setAttribute('position', new THREE.BufferAttribute(this.aSmPos, 3).setUsage(THREE.DynamicDrawUsage));
                this.smGeo.setAttribute('aLife', new THREE.BufferAttribute(this.aSmL, 1).setUsage(THREE.DynamicDrawUsage));
                this.smGeo.setAttribute('aSize', new THREE.BufferAttribute(this.aSmSz, 1).setUsage(THREE.DynamicDrawUsage));
                this.smGeo.setAttribute('aOpacity', new THREE.BufferAttribute(this.aSmOp, 1).setUsage(THREE.DynamicDrawUsage));

                const SMOKE_VERT = `
                    attribute float aLife; attribute float aSize; attribute float aOpacity;
                    varying float vLife; varying float vOp;
                    void main(){
                        vLife=aLife; vOp=aOpacity;
                        vec4 mv=modelViewMatrix*vec4(position,1.);
                        gl_PointSize=aSize*(340./-mv.z);
                        gl_Position=projectionMatrix*mv;
                    }
                `;
                const SMOKE_FRAG = `
                    uniform sampler2D uTex; varying float vLife; varying float vOp;
                    void main(){
                        vec4 t=texture2D(uTex,gl_PointCoord);
                        if(t.a<.005) discard;
                        float fade=(vLife<.1)?(vLife/.1):(vLife>.7?(1.-(vLife-.7)/.3):1.);
                        float grey=mix(.55,.18,vLife);
                        gl_FragColor=vec4(vec3(grey)*t.rgb, t.a*fade*vOp);
                    }
                `;

                this.smMat = new THREE.ShaderMaterial({
                    uniforms: { uTex: { value: texSmoke } },
                    vertexShader: SMOKE_VERT, fragmentShader: SMOKE_FRAG,
                    transparent: true, blending: THREE.NormalBlending, depthWrite: false, depthTest: false
                });
                this.smPoints = new THREE.Points(this.smGeo, this.smMat);
                this.el.setObject3D('smoke', this.smPoints);

                this.smFree = new Int32Array(SM); this.smFreeH = SM;
                for (let i = 0; i < SM; i++) this.smFree[i] = SM - 1 - i;
            },

            tick: function (t, dt) {
                if (!this.data.active) return;
                const rawDt = Math.min(dt / 1000, 0.05);
                this.reactionTime += rawDt;
                const T = this.reactionTime;

                const getPh = (t) => {
                    for (const ph of this.P.phases) if (t >= ph.start && t < ph.end) return ph.id;
                    return this.P.phases[this.P.phases.length - 1].id;
                };
                const getPP = (t, id) => {
                    const ph = this.P.phases.find(p => p.id === id);
                    return Math.max(0, Math.min(1, (t - ph.start) / (ph.end - ph.start)));
                };

                const ph = getPh(T);
                const pp = getPP(T, ph);
                
                let globalParticleScale = 1.0;
                if (ph === 3) {
                    globalParticleScale = Math.max(0.0, 1.0 - pp); // Shrinks from 1 to 0 during cooldown
                }

                // Handle total completion explicitly before phase logic
                if (T >= this.P.totalTime) {
                    this.coreMat.opacity = 0;
                    this.haloMat.opacity = 0;
                    this.coreMesh.scale.setScalar(0.001);
                    this.haloMesh.scale.setScalar(0.001);
                    globalParticleScale = 0.0;
                }
                else if (ph === 1) { // Immediate Flash
                    if (!this.flashFired) {
                        this.flashFired = true;
                        this.spawnIgnitionBurst(700);
                    }
                    this.coreMat.opacity = Math.max(0.6, 1.2 - pp * 0.6);
                    this.haloMat.opacity = Math.max(0.25, 0.6 - pp * 0.35);
                    this.coreMesh.scale.setScalar(.15 - pp * 0.08); // Starts at 0.15, ends at 0.07
                    this.haloMesh.scale.setScalar(.25 - pp * 0.15); // Starts at 0.25, ends at 0.10
                }
                else if (ph === 2) { // Peak Reaction
                    this.coreMat.opacity = .6 - .4 * pp; // 0.6 down to 0.2
                    this.haloMat.opacity = .25 - .15 * pp; // 0.25 down to 0.1
                    this.coreMesh.scale.setScalar(.07 - .04 * pp); // 0.07 down to 0.03
                    this.haloMesh.scale.setScalar(.10 - .06 * pp); // 0.10 down to 0.04
                    const rate = (180 - 80 * pp) * rawDt * 60;
                    this.spawnPeak(Math.floor(rate));
                    if (Math.random() < rawDt * 3.5) this.spawnSmoke(0, 0, 0, .3 + .1 * pp);
                }
                else if (ph === 3) { // Cooldown (Fade significantly)
                    // Fades away entirely so the pot becomes clearly visible
                    this.coreMat.opacity = Math.max(0.0, 0.2 - 0.2 * pp);
                    this.haloMat.opacity = Math.max(0.0, 0.1 - 0.1 * pp);
                    this.coreMesh.scale.setScalar(Math.max(0.001, 0.03 - 0.03 * pp)); // 0.03 down to ~0
                    this.haloMesh.scale.setScalar(Math.max(0.001, 0.04 - 0.04 * pp)); // 0.04 down to ~0

                    const rate = (80 - 76 * pp) * rawDt * 60;
                    if (rate > 1) this.spawnCooldown(Math.floor(rate));
                    // Keep some smoke during cooldown
                    if (Math.random() < rawDt * (2 + 4 * pp)) this.spawnSmoke(0, 0, 0, .4 + .3 * pp);
                }

                for (let i = 0; i < this.S; i++) {
                    if (!this.sAlive[i]) continue;
                    this.sLife[i] += rawDt;
                    const age = this.sLife[i] / this.sMaxL[i];
                    if (age >= 1) {
                        this.sAlive[i] = 0; this.sFree[this.sFreeH++] = i;
                        this.aSpPos[i * 3 + 1] = -200; continue;
                    }
                    this.svx[i] += (Math.random() - .5) * rawDt;
                    this.svz[i] += (Math.random() - .5) * rawDt;
                    this.svy[i] += this.P.gravity * rawDt;
                    const spd = Math.sqrt(this.svx[i] ** 2 + this.svy[i] ** 2 + this.svz[i] ** 2);
                    const drag = 1 - Math.min(.5 * spd * rawDt, .14);
                    this.svx[i] *= drag; this.svy[i] *= drag; this.svz[i] *= drag;
                    this.spx[i] += this.svx[i] * rawDt;
                    this.spy[i] += this.svy[i] * rawDt;
                    this.spz[i] += this.svz[i] * rawDt;
                    if (this.spy[i] <= this.P.groundY) {
                        this.spy[i] = this.P.groundY;
                        if (!this.sSec[i] && this.sBnc[i] < 2 && Math.abs(this.svy[i]) > .55) {
                            this.spawnSecondary(this.spx[i], this.spy[i], this.spz[i], this.svx[i], this.svy[i], this.svz[i], this.sPhase[i]);
                            this.sBnc[i]++;
                            this.svy[i] = Math.abs(this.svy[i]) * (0.08 + Math.random() * 0.18);
                            this.svx[i] *= .42; this.svz[i] *= .42;
                        } else {
                            this.svy[i] = 0; this.svx[i] *= .78; this.svz[i] *= .78;
                            if (Math.abs(this.svx[i]) < .04 && Math.abs(this.svz[i]) < .04) this.sLife[i] = this.sMaxL[i] * .85;
                        }
                    }
                    const j = i * 3;
                    this.aSpPos[j] = this.spx[i]; this.aSpPos[j + 1] = this.spy[i]; this.aSpPos[j + 2] = this.spz[i];
                    this.aSpL[i] = age;
                    const bsz = this.sSec[i] ? (1.2 + Math.random() * 2) : (2.8 + Math.random() * 7.2);
                    this.aSpSz[i] = bsz * (1 - age * .72) * globalParticleScale;
                    this.aSpBr[i] = .62 + .38 * Math.random();
                    this.aSpP[i] = this.sPhase[i];
                }
                this.sparkGeo.getAttribute('position').needsUpdate = true;
                this.sparkGeo.getAttribute('aLife').needsUpdate = true;
                this.sparkGeo.getAttribute('aSize').needsUpdate = true;
                this.sparkGeo.getAttribute('aBright').needsUpdate = true;
                this.sparkGeo.getAttribute('aPhase').needsUpdate = true;

                for (let i = 0; i < this.SM; i++) {
                    if (!this.smAlive[i]) continue;
                    this.smL[i] += rawDt;
                    const age = this.smL[i] / this.smML[i];
                    if (age >= 1) {
                        this.smAlive[i] = 0; this.smFree[this.smFreeH++] = i;
                        this.aSmPos[i * 3 + 1] = -200; continue;
                    }
                    this.smVx[i] += (Math.random() - .5) * .04 * rawDt;
                    this.smVz[i] += (Math.random() - .5) * .04 * rawDt;
                    this.smPx[i] += this.smVx[i] * rawDt; this.smPy[i] += this.smVy[i] * rawDt; this.smPz[i] += this.smVz[i] * rawDt;
                    this.smVy[i] *= (1 - 0.05 * rawDt);
                    const j = i * 3;
                    this.aSmPos[j] = this.smPx[i]; this.aSmPos[j + 1] = this.smPy[i]; this.aSmPos[j + 2] = this.smPz[i];
                    this.aSmL[i] = age;
                    this.aSmSz[i] = (2 + Math.random() * 3) * (1 + age * 3.5) * globalParticleScale;
                    this.aSmOp[i] = 0.5 * (age < 0.1 ? age / 0.1 : (age > 0.7 ? 1 - (age - 0.7) / 0.3 : 1));
                }
                this.smGeo.getAttribute('position').needsUpdate = true;
                this.smGeo.getAttribute('aLife').needsUpdate = true;
                this.smGeo.getAttribute('aSize').needsUpdate = true;
                this.smGeo.getAttribute('aOpacity').needsUpdate = true;

                // Stop completely when done and all particles cleared
                if (T >= this.P.totalTime && this.sFreeH === this.S && this.smFreeH === this.SM) {
                    this.el.setAttribute('visible', false);
                    this.el.setAttribute('thermite-reaction', 'active', false);
                }
            },

            spawnEmber: function () {
                if (this.sFreeH === 0) return;
                const i = this.sFree[--this.sFreeH];
                this.sAlive[i] = 1; this.sSec[i] = 0; this.sBnc[i] = 0; this.sPhase[i] = 1;
                this.spx[i] = (Math.random() + Math.random() - 1) * 1.18 * .12;
                this.spy[i] = 0.05 + Math.random() * 0.15;
                this.spz[i] = (Math.random() + Math.random() - 1) * 1.18 * .12;
                this.svx[i] = (Math.random() + Math.random() - 1) * 1.18 * .2;
                this.svy[i] = 0.15 + Math.random() * 0.4;
                this.svz[i] = (Math.random() + Math.random() - 1) * 1.18 * .2;
                this.sLife[i] = 0; this.sMaxL[i] = 0.6 + Math.random() * 1.2;
            },
            spawnIgnitionBurst: function (n) {
                for (let s = 0; s < n; s++) {
                    if (this.sFreeH === 0) return;
                    const i = this.sFree[--this.sFreeH];
                    this.sAlive[i] = 1; this.sSec[i] = 0; this.sBnc[i] = 0; this.sPhase[i] = 2;
                    const a = Math.random() * Math.PI * 2;
                    const elev = (0.2 + Math.random() * 0.7) * Math.PI / 2;
                    const spd = 4 + Math.random() * 7;
                    this.spx[i] = (Math.random() + Math.random() - 1) * 1.18 * .05;
                    this.spy[i] = Math.random() * .08;
                    this.spz[i] = (Math.random() + Math.random() - 1) * 1.18 * .05;
                    this.svx[i] = Math.cos(elev) * Math.cos(a) * spd;
                    this.svy[i] = Math.sin(elev) * spd + Math.random() * 3;
                    this.svz[i] = Math.cos(elev) * Math.sin(a) * spd;
                    this.sLife[i] = 0; this.sMaxL[i] = 0.5 + Math.random() * 1.3;
                }
            },
            spawnPeak: function (n) {
                for (let s = 0; s < n; s++) {
                    if (this.sFreeH === 0) return;
                    const i = this.sFree[--this.sFreeH];
                    this.sAlive[i] = 1; this.sSec[i] = 0; this.sBnc[i] = 0; this.sPhase[i] = 3;
                    const a = Math.random() * Math.PI * 2;
                    const cone = Math.random() * .5;
                    const spd = 3 + Math.random() * 5.5;
                    this.spx[i] = (Math.random() + Math.random() - 1) * 1.18 * .08;
                    this.spy[i] = Math.random() * .14;
                    this.spz[i] = (Math.random() + Math.random() - 1) * 1.18 * .08;
                    this.svx[i] = Math.cos(a) * cone + (Math.random() + Math.random() - 1) * 1.18 * .28;
                    this.svy[i] = spd;
                    this.svz[i] = Math.sin(a) * cone + (Math.random() + Math.random() - 1) * 1.18 * .28;
                    this.sLife[i] = 0; this.sMaxL[i] = 1.0 + Math.random() * 2.2;
                }
            },
            spawnCooldown: function (n) {
                for (let s = 0; s < n; s++) {
                    if (this.sFreeH === 0) return;
                    const i = this.sFree[--this.sFreeH];
                    this.sAlive[i] = 1; this.sSec[i] = 0; this.sBnc[i] = 0; this.sPhase[i] = 4;
                    const a = Math.random() * Math.PI * 2;
                    const cone = Math.random() * .35;
                    const spd = 1.5 + Math.random() * 3.5;
                    this.spx[i] = (Math.random() + Math.random() - 1) * 1.18 * .07;
                    this.spy[i] = Math.random() * .1;
                    this.spz[i] = (Math.random() + Math.random() - 1) * 1.18 * .07;
                    this.svx[i] = Math.cos(a) * cone + (Math.random() + Math.random() - 1) * 1.18 * .2;
                    this.svy[i] = spd;
                    this.svz[i] = Math.sin(a) * cone + (Math.random() + Math.random() - 1) * 1.18 * .2;
                    this.sLife[i] = 0; this.sMaxL[i] = 0.8 + Math.random() * 1.7;
                }
            },
            spawnSecondary: function (ox, oy, oz, ovx, ovy, ovz, ph) {
                const n = Math.floor(1 + Math.random() * 5);
                for (let s = 0; s < n; s++) {
                    if (this.sFreeH === 0) return;
                    const i = this.sFree[--this.sFreeH];
                    this.sAlive[i] = 1; this.sSec[i] = 1; this.sBnc[i] = 99; this.sPhase[i] = ph;
                    this.spx[i] = ox; this.spy[i] = oy + .01; this.spz[i] = oz;
                    this.svx[i] = ovx * .2 + (Math.random() + Math.random() - 1) * 1.18 * 1.4;
                    this.svy[i] = Math.abs(ovy) * (0.08 + Math.random() * 0.27) + 0.2 + Math.random() * 0.9;
                    this.svz[i] = ovz * .2 + (Math.random() + Math.random() - 1) * 1.18 * 1.4;
                    this.sLife[i] = Math.random() * .06; this.sMaxL[i] = 0.2 + Math.random() * 0.6;
                }
            },
            spawnSmoke: function (x, y, z, opacity) {
                if (this.smFreeH === 0) return;
                const i = this.smFree[--this.smFreeH];
                this.smAlive[i] = 1;
                this.smPx[i] = x + (Math.random() + Math.random() - 1) * 1.18 * .35;
                this.smPy[i] = y + 0.05 + Math.random() * 0.2;
                this.smPz[i] = z + (Math.random() + Math.random() - 1) * 1.18 * .35;
                this.smVx[i] = (Math.random() + Math.random() - 1) * 1.18 * .12;
                this.smVy[i] = 0.08 + Math.random() * 0.24;
                this.smVz[i] = (Math.random() + Math.random() - 1) * 1.18 * .12;
                this.smL[i] = 0; this.smML[i] = 2.5 + Math.random() * 3.0;
                this.aSmOp[i] = opacity;
            }
        });

        function triggerQuiz(phase) {
            const pool = quizPools[phase];
            if (!pool || pool.length === 0) return;

            experimentState.quizActive = true;

            // Pick a random question from the pool
            const randomIndex = Math.floor(Math.random() * pool.length);
            const quizy = pool[randomIndex];
            experimentState.activeQuiz = quizy; // Track the current active quiz object

            document.getElementById('quizQuestion').textContent = quizy.question;

            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';

            quizy.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(i);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quizFeedback').className = 'feedback-text';
            document.getElementById('quizContinueBtn').classList.remove('show');

            const overlay = document.getElementById('quizOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => overlay.classList.add('active'), 10);
        }

        function handleAnswer(selectedIndex) {
            const quizy = experimentState.activeQuiz;
            const feedbackEl = document.getElementById('quizFeedback');
            const options = document.querySelectorAll('.option-btn');

            options.forEach(btn => btn.style.pointerEvents = 'none');

            if (selectedIndex === quizy.correct) {
                options[selectedIndex].classList.add('correct');
                feedbackEl.textContent = quizy.feedback;
                feedbackEl.className = 'feedback-text show feedback-success';
                document.getElementById('quizContinueBtn').classList.add('show');
            } else {
                options[selectedIndex].classList.add('incorrect');
                options[quizy.correct].classList.add('correct');
                feedbackEl.textContent = "Not quite. " + quizy.feedback;
                feedbackEl.className = 'feedback-text show feedback-error';
                document.getElementById('quizContinueBtn').classList.add('show');
            }
        }

            overlay.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
                experimentState.quizActive = false;
            }, 400);
        }

        function animationLoop() {
            // Pause all logic if quiz is active
            if (experimentState.quizActive) {
                requestAnimationFrame(animationLoop);
                return;
            }

            const mainMarker = document.getElementById('mainMarker');

            if (experimentState.activeMarkers.has('main')) {
                const mainPos = new THREE.Vector3();
                mainMarker.object3D.getWorldPosition(mainPos);


                // Pot Snapping
                if (!experimentState.isPotAttached) {
                    experimentState.proximityTarget = 'Pot';
                    if (experimentState.activeMarkers.has('pot')) {
                        const potPos = new THREE.Vector3();
                        document.getElementById('potMarker').object3D.getWorldPosition(potPos);
                        const dist = mainPos.distanceTo(potPos);
                        experimentState.currentDistance = dist;

                        if (dist < experimentState.proximityThreshold) {
                            experimentState.isPotAttached = true;
                            document.getElementById('snappedPot').setAttribute('visible', 'true');
                            document.getElementById('potOriginalModel').setAttribute('visible', 'false');
                            experimentState.currentDistance = 999;
                        }
                    } else {
                        experimentState.currentDistance = 999;
                    }
                }
                // Mixture Snapping
                else if (!experimentState.isMixtureAttached) {
                    experimentState.proximityTarget = 'Mixture';
                    if (experimentState.activeMarkers.has('mixture')) {
                        const mixPos = new THREE.Vector3();
                        document.getElementById('mixtureMarker').object3D.getWorldPosition(mixPos);
                        const dist = mainPos.distanceTo(mixPos);
                        experimentState.currentDistance = dist;

                        if (dist < experimentState.proximityThreshold) {
                            experimentState.isMixtureAttached = true;
                            document.getElementById('snappedPotModel').setAttribute('animation-mixer', "clip: IronOxideandAluminiumpowder; loop: once; clampWhenFinished: true");
                            document.getElementById('mixtureOriginalModel').setAttribute('visible', 'false');
                            experimentState.currentDistance = 999;

                            // Trigger Activation Quiz Pool
                            setTimeout(() => triggerQuiz('activation'), 2000);
                        }
                    } else {
                        experimentState.currentDistance = 999;
                    }
                }
                // Stick Snapping
                else if (!experimentState.isStickAttached) {
                    experimentState.proximityTarget = 'Stick';
                    if (experimentState.activeMarkers.has('stick')) {
                        const stickPos = new THREE.Vector3();
                        document.getElementById('magnesiumStickMarker').object3D.getWorldPosition(stickPos);
                        const dist = mainPos.distanceTo(stickPos);
                        experimentState.currentDistance = dist;

                        if (dist < experimentState.proximityThreshold) {
                            experimentState.isStickAttached = true;
                            document.getElementById('snappedStick').setAttribute('visible', 'true');
                            document.getElementById('stickOriginalModel').setAttribute('visible', 'false');
                            experimentState.currentDistance = 999;
                            console.log('✅ Stick attached. Use lighter to ignite fuse (5s)');

                            // Trigger Setup Quiz Pool
                            setTimeout(() => triggerQuiz('setup'), 2000);
                        }
                    } else {
                        experimentState.currentDistance = 999;
                    }
                } else {
                    experimentState.proximityTarget = 'None';
                    experimentState.currentDistance = 999;
                }

                // Handle Thermite Trigger (5s continuous application of lighter)
                if (experimentState.isStickAttached && !experimentState.thermiteTriggered) {
                    if (experimentState.activeMarkers.has('heat')) {
                        // Approximate dt as 16.6ms since we don't have it in animationLoop
                        experimentState.thermiteIgnitionTimer += 0.0166;

                        if (experimentState.thermiteIgnitionTimer >= 5.0) {
                            console.log('💥 THERMITE IGNITION!');
                            experimentState.thermiteTriggered = true;
                            experimentState.thermiteStartTime = Date.now(); // Set for completion tracking
                            document.getElementById('thermiteEffect').setAttribute('thermite-reaction', 'active: true');

                            // Trigger Reaction Quiz Pool (Mid-reaction Check)
                            setTimeout(() => triggerQuiz('reaction'), 5000);
                        }
                    } else {
                        // Reset timer if lighter is removed? 
                        // Let's keep it for better UX, or let it decay slowly. 
                        // Decaying slowly is a good middle ground.
                        experimentState.thermiteIgnitionTimer = Math.max(0, experimentState.thermiteIgnitionTimer - 0.01);
                    }
                }

                // Handle Thermite Completion (10s reaction after ignition)
                if (experimentState.thermiteTriggered && !experimentState.thermiteCompleted) {
                    const elapsedSinceIgnition = (Date.now() - experimentState.thermiteStartTime) / 1000;
                    if (elapsedSinceIgnition >= 10.0) {
                        console.log('🏁 THERMITE REACTION COMPLETED');
                        experimentState.thermiteCompleted = true;
                        // Switch to Animation_2
                        document.getElementById('sandBoxModel').setAttribute('animation-mixer', "clip: Animation_2; loop: once; clampWhenFinished: true");

                        // Trigger Integration Quiz Pool (Final)
                        setTimeout(() => triggerQuiz('integration'), 5000);
                    }
                }
            }

            if (experimentState.isHeating) {
                experimentState.temperature = Math.min(experimentState.temperature + 2, 100);
            } else if (experimentState.temperature > 25) {
                experimentState.temperature = Math.max(experimentState.temperature - 1, 25);
            }

            //document.getElementById('tempText').setAttribute('value', Math.round(experimentState.temperature) + '°C');
            updateDebugUI();
            requestAnimationFrame(animationLoop);
        }

        function updateDebugUI() {
            const content = document.getElementById('debugContent');

            const getStatus = (val) => val ? '<span class="status-ok">✔ COMPLETED</span>' : '<span class="status-wait">⌛ PENDING</span>';
            const getTracking = (id) => experimentState.activeMarkers.has(id) ?
                '<span style="color:#10b981; font-size:10px;">🟢 TRACKED</span>' :
                '<span style="color:#64748b; font-size:10px;">⚪ NO SIGNAL</span>';

            const getReactionStatus = () => {
                if (experimentState.thermiteCompleted) return '<span class="status-ok">✔ COMPLETED</span>';
                if (experimentState.thermiteTriggered) return '<span class="status-active">🔥 ACTIVE</span>';
                if (experimentState.isStickAttached) return '<span class="status-wait">⏳ IGNITING...</span>';
                return '<span class="status-wait">⌛ LOCKED</span>';
            };

            content.innerHTML = `
                <div style="margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.1)">
                    <div class="debug-item"><span>Main Anchor:</span> ${getTracking('main')}</div>
                    <div class="debug-item"><span>Lighter:</span> ${getTracking('heat')}</div>
                </div>

                <div class="debug-item" style="font-weight:600; color:#e2e8f0; margin-bottom:4px;">PROGRESS</div>
                <div class="debug-item">
                    <span>1. Pot:</span> ${getStatus(experimentState.isPotAttached)}
                </div>
                <div style="margin-left:14px; margin-bottom:6px;">${getTracking('pot')}</div>

                <div class="debug-item">
                    <span>2. Mixture:</span> ${getStatus(experimentState.isMixtureAttached)}
                </div>
                <div style="margin-left:14px; margin-bottom:6px;">${getTracking('mixture')}</div>

                <div class="debug-item">
                    <span>3. Stick:</span> ${getStatus(experimentState.isStickAttached)}
                </div>
                <div style="margin-left:14px; margin-bottom:6px;">${getTracking('stick')}</div>

                <div class="debug-item" style="margin-top:8px; padding-top:4px; border-top:1px dashed rgba(255,255,255,0.2)">
                    <span>REACTION:</span> ${getReactionStatus()}
                </div>

                ${experimentState.isStickAttached && !experimentState.thermiteTriggered ? `
                <div style="margin-top:12px; padding:8px; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.2); border-radius:6px;">
                    <div style="color:#f59e0b; font-size:11px; font-weight:bold; margin-bottom:6px; text-transform:uppercase;">
                        Igniting Fuse...
                    </div>
                    <div style="height:6px; background:rgba(0,0,0,0.3); border-radius:3px; overflow:hidden;">
                        <div style="width:${(experimentState.thermiteIgnitionTimer / 5 * 100)}%; height:100%; background:#f59e0b; transition: width 0.1s linear;"></div>
                    </div>
                    <div style="font-size:10px; color:#94a3b8; margin-top:6px;">
                        ${experimentState.activeMarkers.has('heat') ? '🔥 Lighter detected (Hold for 5s)' : '⚠ Bring lighter near stick'}
                    </div>
                </div>
                ` : ''}

                ${experimentState.proximityTarget !== 'None' ? `
                <div style="margin-top:12px; padding:8px; background:rgba(34,211,238,0.1); border:1px solid rgba(34,211,238,0.2); border-radius:6px;">
                    <div style="color:#22d3ee; font-size:11px; font-weight:bold; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.05em;">
                        Next Step: ${experimentState.proximityTarget}
                    </div>
                    <div style="display:flex; align-items:baseline; gap:6px;">
                        <span style="font-family:monospace; font-size:18px; font-weight:bold; color:${experimentState.currentDistance < experimentState.proximityThreshold ? '#10b981' : '#f59e0b'}">
                            ${experimentState.currentDistance > 100 ? '---' : experimentState.currentDistance.toFixed(2)}
                        </span>
                        <span style="font-size:11px; color:#64748b">/ ${experimentState.proximityThreshold} units</span>
                    </div>
                    <div style="font-size:10px; color:#94a3b8; margin-top:4px;">
                        ${experimentState.activeMarkers.has(experimentState.proximityTarget.toLowerCase()) ?
                        'Move closer to trigger snap' : 'Bring marker into view'}
                    </div>
                </div>
                ` : ''}
            `;
        }
    </script>
</body>


</html>
