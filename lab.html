<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Lab Explorer - Laboratory</title>

    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js with Marker Tracking Support -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Particle System Component -->
    <script
        src="https://cdn.jsdelivr.net/gh/c-frame/aframe-particle-system-component@master/dist/aframe-particle-system-component.min.js"></script>

    <!-- A-Frame Extras for Animation Mixer -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f1f5f9;
            border-top: 4px solid #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #loadingScreen h2 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        #loadingScreen p {
            color: #64748b;
        }

        #debugPanel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(15, 23, 42, 0.9);
            color: #22d3ee;
            padding: 15px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-width: 280px;
            z-index: 100;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.2);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #1e293b;
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Menu
    </a>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="spinner"></div>
        <h2>Preparing Laboratory...</h2>
        <p>Calibrating AR sensors</p>
    </div>

    <!-- Debug Panel -->
    <div id="debugPanel" style="display: none;">
        <strong>🔍 Debug Info</strong>
        <div id="debugContent"></div>
    </div>

    <!-- A-Frame AR Scene -->
    <a-scene id="arScene" embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3_PARITY65; sourceWidth:1280; sourceHeight:720; displayWidth: 1280; displayHeight: 720;"
        vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;">

        <!-- Assets -->
        <a-assets>
            <!-- Models and textures can be preloaded here -->
        </a-assets>

        <!-- MAIN MARKER (Hiro Pattern - represents the chemistry apparatus) -->
        <a-marker id="mainMarker" type="barcode" value="5" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="mainContent" position="0 0 0" scale="1 1 1">
                <a-entity id="snappedSandBox" visible="true" scale="0.5  0.5 0.5" position="0 0 0">
                    <a-entity gltf-model="Assets/Exothermic reaction/Sand inside square box.glb"></a-entity>
                </a-entity>

                <a-entity id="snappedStand" visible="false" scale="0.25 0.5 0.25" position="-0.2 0.5 0">
                    <a-entity gltf-model="Assets/Exothermic reaction/Stand.glb"></a-entity>
                </a-entity>

                <a-entity id="snappedPot" visible="false" scale="0.2 0.2 0.2" position="-0.1 0.9 0">
                    <a-entity gltf-model="Assets/Exothermic reaction/Ceramic pot.glb"></a-entity>
                </a-entity>

                <a-entity id="snappedMixture" visible="false" scale="0.1 0.1 0.1" position="-0.1 0.9 0">
                    <a-entity gltf-model="Assets/Exothermic reaction/Iron Oxide and Aluminium powder.glb"></a-entity>
                </a-entity>

                <a-entity id="snappedStick" visible="false" scale="0.2 0.2 0.2" position="-0.1 1.1 0" rotation="0 0 15">
                    <a-entity gltf-model="Assets/Exothermic reaction/Magnesium Stick.glb"></a-entity>
                </a-entity>

                <a-text id="tempText" value="25°C" color="#FF4444" position="0 1.25 0" scale="0.15 0.15 0.15"
                    align="center"></a-text>
                <a-text id="labLabel" value="Chemistry Lab" color="#00FF00" position="0 -0.45 0" scale="0.1 0.1 0.1"
                    align="center"></a-text>

                <!-- Thermite Reaction Effect (Modular) -->
                <a-entity id="thermiteEffect" thermite-reaction="active: false" position="0 0.9 0"></a-entity>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 1: HEAT (Barcode 0) -->
        <a-marker id="heatMarker" type="barcode" value="0" emitevents="true" smooth="true" smoothCount="8">
            <a-entity position="0 0 0" scale="3 3 3">
                <a-entity gltf-model="Assets/Exothermic reaction/Lighter.glb" position="0 0 0"
                    animation-mixer="clip: Flame"></a-entity>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 2: POT (Barcode 1) -->
        <a-marker id="potMarker" type="barcode" value="1" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="potOriginalModel" position="0 0 0" scale="1 1 1">
                <a-entity gltf-model="Assets/Exothermic reaction/Ceramic pot.glb" position="0 0 0"></a-entity>
                <a-text value="POT" color="#FFFFFF" position="0 0.5 0" scale="300 300 300" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 3: REAGENT (Barcode 2) -->
        <a-marker id="sandBoxMarker" type="barcode" value="2" emitevents="true" smooth="true" smoothCount="8">
            <a-entity position="0 0 0" scale="5 5 5">
                <a-entity gltf-model="Assets/Exothermic reaction/Sand inside square box.glb"
                    position="0 0 0"></a-entity>
                <a-text value="🧬 REAGENT" color="#FFFFFF" position="0 0.5 0" scale="0.15 0.15 0.15"
                    align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 4: TRIPOD STAND (Barcode 3) -->
        <a-marker id="tripodStandMarker" type="barcode" value="3" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="standOriginalModel" position="0 0 0" scale="5 5 5">
                <a-entity gltf-model="Assets/Exothermic reaction/Stand.glb" position="0 0 0"></a-entity>
                <a-text value="TRIPOD" color="#FFFFFF" position="0 0.5 0" scale="0.2 0.2 0.2" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 5: MIXTURE (Barcode 4) -->
        <a-marker id="mixtureMarker" type="barcode" value="7" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="mixtureOriginalModel" position="0 0 0" scale="0.2 0.2 0.2">
                <a-entity gltf-model="Assets/Exothermic reaction/Iron Oxide and Aluminium powder.glb"
                    position="0 0 0"></a-entity>
                <a-text value="MIXTURE" color="#FFFFFF" position="0 0.5 0" scale="1 1 1" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- EVENT MARKER 6: MAGNESIUM STICK (Barcode 6) -->
        <a-marker id="magnesiumStickMarker" type="barcode" value="6" emitevents="true" smooth="true" smoothCount="8">
            <a-entity id="stickOriginalModel" position="0 0 0" scale="1 1 1">
                <a-entity gltf-model="Assets/Exothermic reaction/Magnesium Stick.glb" position="0 0 0"></a-entity>
                <a-text value="STICK" color="#FFFFFF" position="0 0.5 0" scale="0.4 0.4 0.4" align="center"></a-text>
            </a-entity>
        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const experimentState = {
            temperature: 25,
            isHeating: false,
            activeMarkers: new Set(),
            isStandAttached: false,
            isPotAttached: false,
            isMixtureAttached: false,
            isStickAttached: false,
            proximityThreshold: 4.0,
            thermiteStartTime: 0,
            thermiteTriggered: false
        };

        // --- Thermite Particle System Component ---
        AFRAME.registerComponent('thermite-reaction', {
            schema: { active: { default: false } },
            init: function () {
                this.S = 5000; // Sparks
                this.SM = 400; // Smoke
                this.reactionTime = 0;
                this.active = false;

                // Geometry/Material setup for sparks
                this.sparkGeo = new THREE.BufferGeometry();
                this.aSpPos = new Float32Array(this.S * 3);
                this.aSpL = new Float32Array(this.S); // Age/Life
                this.aSpP = new Float32Array(this.S); // Phase

                this.sparkGeo.setAttribute('position', new THREE.BufferAttribute(this.aSpPos, 3).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aLife', new THREE.BufferAttribute(this.aSpL, 1).setUsage(THREE.DynamicDrawUsage));
                this.sparkGeo.setAttribute('aPhase', new THREE.BufferAttribute(this.aSpP, 1).setUsage(THREE.DynamicDrawUsage));

                const SPARK_VERT = `
                    attribute float aLife;
                    attribute float aPhase;
                    varying float vLife;
                    varying float vPhase;
                    void main(){
                      vLife = aLife;
                      vPhase = aPhase;
                      vec4 mv = modelViewMatrix * vec4(position, 1.0);
                      gl_PointSize = (vPhase == 2.0 ? 15.0 : 8.0) * (300.0 / -mv.z) * (1.0 - aLife);
                      gl_Position = projectionMatrix * mv;
                    }
                `;
                const SPARK_FRAG = `
                    varying float vLife;
                    varying float vPhase;
                    void main(){
                      float d = distance(gl_PointCoord, vec2(0.5));
                      if(d > 0.5) discard;
                      vec3 color = vec3(1.0, 0.4, 0.1);
                      if(vPhase == 2.0) color = vec3(1.0, 1.0, 0.8);
                      gl_FragColor = vec4(color, (1.0 - vLife) * 0.8);
                    }
                `;

                this.sparkMat = new THREE.ShaderMaterial({
                    vertexShader: SPARK_VERT,
                    fragmentShader: SPARK_FRAG,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                this.sparkPoints = new THREE.Points(this.sparkGeo, this.sparkMat);
                this.el.setObject3D('sparks', this.sparkPoints);

                // CPU Data
                this.spData = [];
                for (let i = 0; i < this.S; i++) {
                    this.spData.push({ alive: false, pos: new THREE.Vector3(), vel: new THREE.Vector3(), life: 0, maxL: 0, phase: 0 });
                }
            },

            tick: function (t, dt) {
                if (!this.data.active) return;
                const delta = dt / 1000;
                this.reactionTime += delta;

                // Spawn logic
                let spawnRate = 0;
                let phase = 1;
                if (this.reactionTime < 2) { spawnRate = 50; phase = 1; } // Pre-ignition
                else if (this.reactionTime < 2.5) { spawnRate = 800; phase = 2; } // Flash
                else if (this.reactionTime < 6) { spawnRate = 200; phase = 3; } // Peak
                else if (this.reactionTime < 10) { spawnRate = 50; phase = 4; } // Cooldown

                for (let i = 0; i < spawnRate * delta; i++) {
                    this.spawnSpark(phase);
                }

                // Update logic
                const posAttr = this.sparkGeo.getAttribute('position');
                const lifeAttr = this.sparkGeo.getAttribute('aLife');
                const phaseAttr = this.sparkGeo.getAttribute('aPhase');

                for (let i = 0; i < this.S; i++) {
                    const s = this.spData[i];
                    if (!s.alive) continue;

                    s.life += delta;
                    if (s.life > s.maxL) {
                        s.alive = false;
                        posAttr.setY(i, -100);
                        continue;
                    }

                    s.vel.y -= 9.8 * delta; // Gravity
                    s.pos.addScaledVector(s.vel, delta);

                    // Ground bounce
                    if (s.pos.y < 0) {
                        s.pos.y = 0;
                        s.vel.y = Math.abs(s.vel.y) * 0.3;
                        s.vel.x *= 0.6;
                        s.vel.z *= 0.6;
                    }

                    posAttr.setXYZ(i, s.pos.x, s.pos.y, s.pos.z);
                    lifeAttr.setX(i, s.life / s.maxL);
                    phaseAttr.setX(i, s.phase);
                }
                posAttr.needsUpdate = true;
                lifeAttr.needsUpdate = true;
                phaseAttr.needsUpdate = true;
            },

            spawnSpark: function (phase) {
                const i = this.spData.findIndex(s => !s.alive);
                if (i === -1) return;
                const s = this.spData[i];
                s.alive = true;
                s.life = 0;
                s.phase = phase;
                s.maxL = Math.random() * 2 + 0.5;
                s.pos.set(0, 0, 0);

                if (phase === 2) { // Flash
                    const angle = Math.random() * Math.PI * 2;
                    const spd = Math.random() * 8 + 4;
                    s.vel.set(Math.cos(angle) * spd, Math.random() * 10 + 2, Math.sin(angle) * spd);
                } else {
                    s.vel.set((Math.random() - 0.5) * 4, Math.random() * 6 + 2, (Math.random() - 0.5) * 4);
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const experimentType = params.get('experiment') || 'molar-mass';
            console.log('🧪 Laboratory initialized for:', experimentType);

            if (experimentType === 'plant-cell') {
                document.getElementById('labLabel').setAttribute('value', 'Biology Lab');
            } else if (experimentType === 'acid-base') {
                document.getElementById('labLabel').setAttribute('value', 'Titration Lab');
            }

            const scene = document.getElementById('arScene');
            scene.addEventListener('loaded', () => {
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loadingScreen').style.display = 'none';
                    }, 500);
                }, 2000);
            });

            setupMarkerEventListeners();
            animationLoop();
        });

        function setupMarkerEventListeners() {
            const mainMarker = document.getElementById('mainMarker');
            mainMarker.addEventListener('markerFound', () => experimentState.activeMarkers.add('main'));
            mainMarker.addEventListener('markerLost', () => experimentState.activeMarkers.delete('main'));

            const heatMarker = document.getElementById('heatMarker');
            heatMarker.addEventListener('markerFound', () => experimentState.isHeating = true);
            heatMarker.addEventListener('markerLost', () => experimentState.isHeating = false);

            document.getElementById('potMarker').addEventListener('markerFound', () => experimentState.activeMarkers.add('pot'));
            document.getElementById('tripodStandMarker').addEventListener('markerFound', () => experimentState.activeMarkers.add('stand'));
            document.getElementById('mixtureMarker').addEventListener('markerFound', () => experimentState.activeMarkers.add('mixture'));
            document.getElementById('magnesiumStickMarker').addEventListener('markerFound', () => experimentState.activeMarkers.add('stick'));
        }

        function animationLoop() {
            const mainMarker = document.getElementById('mainMarker');

            if (experimentState.activeMarkers.has('main')) {
                const mainPos = new THREE.Vector3();
                mainMarker.object3D.getWorldPosition(mainPos);

                // Stand
                if (experimentState.activeMarkers.has('stand') && !experimentState.isStandAttached) {
                    const pos = new THREE.Vector3();
                    document.getElementById('tripodStandMarker').object3D.getWorldPosition(pos);
                    if (mainPos.distanceTo(pos) < experimentState.proximityThreshold) {
                        experimentState.isStandAttached = true;
                        document.getElementById('snappedStand').setAttribute('visible', 'true');
                        document.getElementById('standOriginalModel').setAttribute('visible', 'false');
                    }
                }

                // Pot
                if (experimentState.activeMarkers.has('pot') && experimentState.isStandAttached && !experimentState.isPotAttached) {
                    const pos = new THREE.Vector3();
                    document.getElementById('potMarker').object3D.getWorldPosition(pos);
                    if (mainPos.distanceTo(pos) < experimentState.proximityThreshold) {
                        experimentState.isPotAttached = true;
                        document.getElementById('snappedPot').setAttribute('visible', 'true');
                        document.getElementById('potOriginalModel').setAttribute('visible', 'false');
                    }
                }

                // Mixture
                if (experimentState.activeMarkers.has('mixture') && experimentState.isPotAttached && !experimentState.isMixtureAttached) {
                    const pos = new THREE.Vector3();
                    document.getElementById('mixtureMarker').object3D.getWorldPosition(pos);
                    if (mainPos.distanceTo(pos) < experimentState.proximityThreshold) {
                        experimentState.isMixtureAttached = true;
                        document.getElementById('snappedMixture').setAttribute('visible', 'true');
                        document.getElementById('mixtureOriginalModel').setAttribute('visible', 'false');
                    }
                }

                // Stick
                if (experimentState.activeMarkers.has('stick') && experimentState.isMixtureAttached && !experimentState.isStickAttached) {
                    const pos = new THREE.Vector3();
                    document.getElementById('magnesiumStickMarker').object3D.getWorldPosition(pos);
                    if (mainPos.distanceTo(pos) < experimentState.proximityThreshold) {
                        experimentState.isStickAttached = true;
                        document.getElementById('snappedStick').setAttribute('visible', 'true');
                        document.getElementById('stickOriginalModel').setAttribute('visible', 'false');

                        // Start Thermite ignition countdown
                        experimentState.thermiteStartTime = Date.now();
                        console.log('⏳ Thermite countdown started... 5s to ignition');
                    }
                }

                // Handle Thermite Trigger (5s Delay)
                if (experimentState.isStickAttached && !experimentState.thermiteTriggered) {
                    const elapsed = (Date.now() - experimentState.thermiteStartTime) / 1000;
                    if (elapsed >= 5.0) {
                        console.log('💥 THERMITE IGNITION!');
                        experimentState.thermiteTriggered = true;
                        document.getElementById('thermiteEffect').setAttribute('thermite-reaction', 'active: true');
                    }
                }
            }

            if (experimentState.isHeating) {
                experimentState.temperature = Math.min(experimentState.temperature + 2, 100);
            } else if (experimentState.temperature > 25) {
                experimentState.temperature = Math.max(experimentState.temperature - 1, 25);
            }

            document.getElementById('tempText').setAttribute('value', Math.round(experimentState.temperature) + '°C');
            requestAnimationFrame(animationLoop);
        }
    </script>
</body>

</html>
